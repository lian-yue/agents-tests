<!DOCTYPE html>

<title>鹈鹕骑自行车</title>
<style>
  html, body { height: 100%; margin: 0; background: #8ecae6; }
  body { display: grid; place-items: center; }
  svg { width: min(980px, 100%); height: auto; display: block; }
  .cloud { animation: drift 46s linear infinite; }
  .hill { animation: drift 26s linear infinite; }
  .dash { animation: drift 2s linear infinite; }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 0.7s linear infinite; }
  .crank { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
  .stay { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite reverse; }
  .bob { animation: bob 0.6s ease-in-out infinite; }
  .wing { transform-box: fill-box; transform-origin: 80% 50%; animation: flap 0.7s ease-in-out infinite; }
  .pouch { transform-box: fill-box; transform-origin: 0 0; animation: sag 1.2s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-960px); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
  @keyframes flap { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-24deg); } }
  @keyframes sag { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.08); } }
</style>
