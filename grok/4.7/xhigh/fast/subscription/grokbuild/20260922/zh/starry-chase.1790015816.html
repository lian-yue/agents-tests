    <h1>星空追逐</h1>
    <button type="button" id="toggle" hidden>暂停</button>

  <script>
    (function () {
      var svg = document.querySelector("svg");
      var toggle = document.getElementById("toggle");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var impact = 6.5 * 0.7;
      var raf = 0;
      var last = 0;
      var phase = reduce ? impact : 0;

      var nearThigh = document.getElementById("near-thigh");
      var nearShin = document.getElementById("near-shin");
      var farThigh = document.getElementById("far-thigh");
      var farShin = document.getElementById("far-shin");
      var nearHip = { x: -4, y: -84, l1: 36, l2: 40 };
      var farHip = { x: -22, y: -78, l1: 34, l2: 38 };
      var bb = { x: -42, y: -2 };
      var crankR = 16;

      function knee(hx, hy, fx, fy, l1, l2) {
        var dx = fx - hx;
        var dy = fy - hy;
        var dist = Math.hypot(dx, dy) || 1;
        var max = l1 + l2 - 0.01;
        var min = Math.abs(l1 - l2) + 0.01;
        var d = Math.min(max, Math.max(min, dist));
        var ux = dx / dist;
        var uy = dy / dist;
        var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
        var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
        var px = hx + ux * a;
        var py = hy + uy * a;
        var ax = px + uy * h;
        var ay = py - ux * h;
        var bx = px - uy * h;
        var by = py + ux * h;
        if (ax < bx) {
          return [ax, ay];
        }
        return [bx, by];
      }

      function setLine(line, x1, y1, x2, y2) {
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
      }

      function render() {
        var crank = phase / 0.86 * Math.PI * 2;
        var c = Math.cos(crank);
        var s = Math.sin(crank);
        var near = knee(nearHip.x, nearHip.y, bb.x + crankR * c, bb.y + crankR * s, nearHip.l1, nearHip.l2);
        var far = knee(farHip.x, farHip.y, bb.x - crankR * c, bb.y - crankR * s, farHip.l1, farHip.l2);
        setLine(nearThigh, nearHip.x, nearHip.y, near[0], near[1]);
        setLine(nearShin, near[0], near[1], bb.x + crankR * c, bb.y + crankR * s);
        setLine(farThigh, farHip.x, farHip.y, far[0], far[1]);
        setLine(farShin, far[0], far[1], bb.x - crankR * c, bb.y - crankR * s);
      }

      function tick(now) {
        var dt = last ? Math.min(34, now - last) : 16;
        last = now;
        phase += dt / 1000;
        render();
        raf = requestAnimationFrame(tick);
      }

      render();

      if (reduce) {
        svg.setCurrentTime(impact);
        svg.pauseAnimations();
        return;
      }

      toggle.hidden = false;
      toggle.setAttribute("aria-pressed", "false");
      raf = requestAnimationFrame(tick);
      toggle.addEventListener("click", function () {
        if (raf) {
          cancelAnimationFrame(raf);
          raf = 0;
          last = 0;
          svg.pauseAnimations();
          toggle.textContent = "继续";
          toggle.setAttribute("aria-pressed", "true");
        } else {
          svg.unpauseAnimations();
          toggle.textContent = "暂停";
          toggle.setAttribute("aria-pressed", "false");
          raf = requestAnimationFrame(tick);
        }
      });
    }());
  </script>
