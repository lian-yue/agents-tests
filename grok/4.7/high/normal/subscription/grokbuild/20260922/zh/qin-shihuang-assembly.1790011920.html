<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秦始皇在现代流水线上打螺丝</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07060a;
    --ink: #f4ead4;
    --muted: #b7ab96;
    --gold: #e0c27a;
    --gold-dim: rgba(224, 194, 122, 0.35);
    --line: rgba(224, 194, 122, 0.28);
    --panel: rgba(10, 9, 8, 0.78);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px 20px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
    background: #0c0b09;
    z-index: 3;
  }
  h1 {
    margin: 0;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  h1 small {
    display: block;
    margin-top: 2px;
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 0.22em;
    font-weight: 500;
  }
  nav { display: flex; gap: 14px; }
  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.12em;
  }
  nav a:hover, nav a:focus-visible { color: var(--gold); }
  button, .chip {
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover, button:focus-visible, .chip:focus-visible {
    border-color: var(--gold);
    outline: none;
  }
  button[aria-pressed="true"] {
    background: var(--gold);
    color: #1a1408;
    border-color: var(--gold);
  }
  main { position: relative; flex: 1; min-height: 0; }
  #stage, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 48%, rgba(0, 0, 0, 0.5) 100%);
  }
  #process, #controls, #card, #boot, #fail {
    position: absolute;
    z-index: 2;
  }
  #process {
    left: 16px;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(8px);
  }
  #process ol {
    display: flex;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
    overflow-x: auto;
  }
  .chip { white-space: nowrap; color: var(--muted); padding: 4px 10px; }
  .chip[aria-current="true"] {
    background: var(--gold);
    color: #1a1408;
    border-color: var(--gold);
  }
  #phaseName {
    min-width: 4.5em;
    font-family: "Songti SC", "STSong", serif;
    font-size: 22px;
    letter-spacing: 0.14em;
  }
  #bar {
    flex: 1 1 120px;
    height: 4px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  #bar span {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #8c6a32, var(--gold));
  }
  #count { color: var(--muted); font-size: 12px; letter-spacing: 0.06em; }
  #controls {
    top: 14px;
    right: 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
    max-width: min(420px, calc(100% - 28px));
  }
  #card {
    top: 62px;
    right: 14px;
    width: min(240px, calc(100% - 28px));
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(8px);
  }
  #card[hidden] { display: none; }
  #card h2 { margin: 0 0 8px; font-size: 16px; font-family: "Songti SC", "STSong", serif; letter-spacing: 0.08em; }
  #card p { margin: 4px 0; color: var(--muted); font-size: 13px; }
  #card strong { color: var(--ink); font-weight: 600; }
  #boot, #fail {
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(7, 6, 10, 0.72);
    font-family: "Songti SC", "STSong", serif;
    letter-spacing: 0.12em;
  }
  #fail {
    display: none;
    color: #ffd0c8;
    padding: 24px;
    text-align: center;
  }
  #help {
    position: absolute;
    z-index: 4;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(420px, calc(100% - 32px));
    padding: 18px 18px 14px;
    background: #12100c;
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  #help[hidden] { display: none; }
  #help h2 { margin: 0 0 8px; font-family: "Songti SC", "STSong", serif; font-size: 18px; }
  #help ul { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.7; }
  #help .row { display: flex; justify-content: flex-end; margin-top: 12px; }
  #diag {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  @media (max-width: 720px) {
    header { align-items: flex-start; }
    h1 { font-size: 15px; }
    #phaseName { font-size: 18px; }
    #controls { top: 8px; right: 8px; }
    #process { left: 8px; right: 8px; bottom: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>秦始皇在现代流水线上打螺丝<small>黑金工场</small></h1>
  <nav aria-label="页面">
    <a href="#scene">场景</a>
    <a href="#process">工序</a>
    <a href="#controls">操作</a>
  </nav>
</header>
<main id="scene">
  <div id="stage"></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="boot">场景准备中</div>
  <div id="fail" role="alert"></div>
  <section id="controls" aria-label="操作">
    <button type="button" id="pauseBtn" aria-pressed="false">暂停</button>
    <button type="button" id="speedSlow" aria-pressed="false">0.5×</button>
    <button type="button" id="speedNorm" aria-pressed="true">1×</button>
    <button type="button" id="speedFast" aria-pressed="false">2×</button>
    <button type="button" id="camBtn">镜头</button>
    <button type="button" id="helpBtn" aria-expanded="false" aria-controls="help">说明</button>
  </section>
  <aside id="card" hidden>
    <h2 id="cardTitle">工件</h2>
    <p>螺丝 <strong id="cardScrew">—</strong></p>
    <p>位置 <strong id="cardPlace">—</strong></p>
    <p>循环 <strong id="cardLoop">在线</strong></p>
  </aside>
  <section id="help" hidden>
    <h2>操作</h2>
    <ul>
      <li>拖拽旋转镜头，滚轮或双指缩放。</li>
      <li>点击工件，查看螺丝和所在工位。</li>
      <li>空格暂停，R 恢复默认镜头，Esc 关闭说明。</li>
    </ul>
    <div class="row"><button type="button" id="helpClose">关闭</button></div>
  </section>
  <section id="process" aria-label="工序">
    <div id="phaseName">传送</div>
    <ol id="chips"></ol>
    <div id="bar" aria-hidden="true"><span id="barFill"></span></div>
    <div id="count">本班完成 0 件</div>
  </section>
  <div id="live" class="sr" aria-live="polite"></div>
  <pre id="diag"></pre>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
(function () {
  'use strict';

  var bootEl = document.getElementById('boot');
  var failEl = document.getElementById('fail');
  var diagEl = document.getElementById('diag');

  if (!window.THREE) {
    bootEl.textContent = '三维引擎未能加载。请联网后刷新。';
    return;
  }

  var THREE = window.THREE;
  var params = new URLSearchParams(location.search);
  var clamp = THREE.MathUtils.clamp;
  var lerp = THREE.MathUtils.lerp;

  var SPACING = 2;
  var COUNT = 7;
  var TOP = 6;
  var VERT = 1;
  var PERIM = 14;
  var XL = -3.2;
  var XR = 3.2;
  var X_SCALE = (XR - XL) / TOP;
  var Y_TOP = 0.9;
  var GEO_DROP = 0.68;
  var Y_BOT = Y_TOP - GEO_DROP;
  var EMP_Z = 0.64;
  var UPPER = 0.36;
  var FORE = 0.33;
  var TIP = 0.2;
  var GAP = 0.0015;
  var HOVER = 0.07;
  var LIFT = 0.05;
  var TURNS = 4;
  var PROUD_UP = 0.046;
  var PROUD_FLUSH = 0.0015;
  var PIECE_W = 0.5;
  var PIECE_D = 0.34;
  var PIECE_H = 0.135;
  var HEAD_H = 0.018;
  var SCREW_X = 0;
  var SCREW_Z = 0.1;
  var SHANK_L = 0.07;
  var HOLE_R = 0.022;

  var PHASES = [
    { id: 'shift', name: '传送', dur: 1.5 },
    { id: 'observe', name: '观察', dur: 0.55 },
    { id: 'align', name: '对准', dur: 0.6 },
    { id: 'press', name: '下压', dur: 0.38 },
    { id: 'twist', name: '旋拧', dur: 1.4 },
    { id: 'confirm', name: '确认', dur: 0.5 },
    { id: 'reset', name: '复位', dur: 0.58 }
  ];

  var cycleDur = 0;
  for (var pi = 0; pi < PHASES.length; pi++) cycleDur += PHASES[pi].dur;

  var Y_AXIS = new THREE.Vector3(0, 1, 0);
  var IDQ = new THREE.Quaternion();

  function smootherstep(t) {
    t = clamp(t, 0, 1);
    return t * t * t * (t * (t * 6 - 15) + 10);
  }

  function restS(step) {
    return 1 + step * SPACING;
  }

  function wrapS(s) {
    var u = s % PERIM;
    return u < 0 ? u + PERIM : u;
  }

  // Path parameter runs top, drop, return, rise. Pieces stay on this loop and are reset while hidden under the belt.
  //
  // 路径参数依次走过台面、下降、回流、上升。工件沿环线复用，复位发生在皮带下方的遮蔽段。
  function pathPoint(s, out) {
    var u = wrapS(s);
    if (u <= TOP) {
      out.set(XL + X_SCALE * u, Y_TOP, 0);
      return;
    }
    u -= TOP;
    if (u <= VERT) {
      out.set(XR, Y_TOP - u * GEO_DROP, 0);
      return;
    }
    u -= VERT;
    if (u <= TOP) {
      out.set(XR - X_SCALE * u, Y_BOT, 0);
      return;
    }
    u -= TOP;
    out.set(XL, Y_BOT + u * GEO_DROP, 0);
  }

  function displayS(step) {
    var s0 = restS(step);
    if (phaseId() === 'shift') s0 += smootherstep(phaseT) * SPACING;
    return s0;
  }

  var qa = {
    y: new THREE.Vector3(),
    x: new THREE.Vector3(),
    z: new THREE.Vector3(),
    m: new THREE.Matrix4(),
    fb: new THREE.Vector3(1, 0, 0)
  };

  function quatAlignDown(dir, hint, out) {
    var y = qa.y.copy(dir).multiplyScalar(-1);
    if (y.lengthSq() < 1e-10) y.set(0, 1, 0);
    else y.normalize();
    var x = qa.x.crossVectors(hint, y);
    if (x.lengthSq() < 1e-8) {
      qa.fb.set(Math.abs(y.y) > 0.9 ? 0 : 1, 0, Math.abs(y.y) > 0.9 ? 1 : 0);
      x.crossVectors(qa.fb, y);
    }
    x.normalize();
    var z = qa.z.crossVectors(x, y).normalize();
    x.crossVectors(y, z).normalize();
    qa.m.makeBasis(x, y, z);
    out.setFromRotationMatrix(qa.m);
  }

  var ikv = {
    shoulder: new THREE.Vector3(),
    to: new THREE.Vector3(),
    pole: new THREE.Vector3(),
    poleDir: new THREE.Vector3(),
    upperDir: new THREE.Vector3(),
    elbow: new THREE.Vector3(),
    wrist: new THREE.Vector3(),
    lowerDir: new THREE.Vector3()
  };
  var ikq = {
    parent: new THREE.Quaternion(),
    world: new THREE.Quaternion()
  };

  function solveTwoBone(upper, lower, target, poleOff, lu, lf) {
    var shoulder = ikv.shoulder;
    upper.getWorldPosition(shoulder);
    var to = ikv.to.copy(target).sub(shoulder);
    var dist = to.length();
    var maxL = lu + lf - 1e-4;
    var minL = Math.abs(lu - lf) + 1e-4;
    if (dist < 1e-6) {
      to.set(0, -1, 0);
      dist = minL;
    } else {
      to.multiplyScalar(1 / dist);
    }
    var clamped = Math.min(maxL, Math.max(minL, dist));
    var poleDir = ikv.poleDir.copy(poleOff);
    var along = poleDir.dot(to);
    poleDir.addScaledVector(to, -along);
    if (poleDir.lengthSq() < 1e-8) poleDir.set(1, 0, 0);
    else poleDir.normalize();
    var cosA = (clamped * clamped + lu * lu - lf * lf) / (2 * clamped * lu);
    var angA = Math.acos(clamp(cosA, -1, 1));
    var upperDir = ikv.upperDir.copy(to).multiplyScalar(Math.cos(angA)).addScaledVector(poleDir, Math.sin(angA)).normalize();
    quatAlignDown(upperDir, poleDir, ikq.world);
    upper.parent.updateWorldMatrix(true, false);
    ikq.parent.setFromRotationMatrix(upper.parent.matrixWorld);
    upper.quaternion.copy(ikq.parent.invert()).multiply(ikq.world);
    upper.updateWorldMatrix(true, false);
    var elbow = ikv.elbow.copy(shoulder).addScaledVector(upperDir, lu);
    var wrist = ikv.wrist.copy(shoulder).addScaledVector(to, clamped);
    var lowerDir = ikv.lowerDir.copy(wrist).sub(elbow);
    if (lowerDir.lengthSq() < 1e-10) lowerDir.copy(upperDir);
    else lowerDir.normalize();
    quatAlignDown(lowerDir, poleDir, ikq.world);
    ikq.parent.setFromRotationMatrix(upper.matrixWorld);
    lower.quaternion.copy(ikq.parent.invert()).multiply(ikq.world);
  }

  function makeCanvas(w, h, draw) {
    var c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    draw(c.getContext('2d'), w, h);
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var floorTex = makeCanvas(512, 512, function (ctx, w, h) {
    ctx.fillStyle = '#141311';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#2a261f';
    ctx.lineWidth = 2;
    for (var i = 0; i <= 8; i++) {
      ctx.beginPath();
      ctx.moveTo((i / 8) * w, 0);
      ctx.lineTo((i / 8) * w, h);
      ctx.moveTo(0, (i / 8) * h);
      ctx.lineTo(w, (i / 8) * h);
      ctx.stroke();
    }
    ctx.strokeStyle = '#8d7040';
    ctx.lineWidth = 6;
    ctx.strokeRect(18, 18, w - 36, h - 36);
    ctx.strokeStyle = '#d7bd86';
    ctx.lineWidth = 2;
    ctx.strokeRect(28, 28, w - 56, h - 56);
  });
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
  floorTex.repeat.set(6, 6);

  var robeTex = makeCanvas(512, 256, function (ctx, w, h) {
    ctx.fillStyle = '#100e0c';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#a78445';
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 2;
    for (var x = 20; x < w; x += 64) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.bezierCurveTo(x + 18, h * 0.3, x - 18, h * 0.6, x + 6, h);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#c6a15b';
    ctx.fillRect(0, h - 28, w, 10);
    ctx.fillStyle = '#6e5328';
    ctx.fillRect(0, h - 14, w, 8);
  });
  robeTex.wrapS = THREE.RepeatWrapping;

  var wallTex = makeCanvas(1024, 512, function (ctx, w, h) {
    ctx.fillStyle = '#0e0c0a';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#8d7040';
    ctx.lineWidth = 4;
    for (var k = 0; k < 6; k++) {
      ctx.strokeRect(36 + k * 10, 28 + k * 8, w - 72 - k * 20, h - 56 - k * 16);
    }
    ctx.beginPath();
    ctx.arc(w / 2, h / 2 + 10, 78, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(w / 2, h / 2 + 10, 46, 0, Math.PI * 2);
    ctx.stroke();
    for (var a = 0; a < 12; a++) {
      var ang = (a / 12) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(w / 2 + Math.cos(ang) * 52, h / 2 + 10 + Math.sin(ang) * 52);
      ctx.lineTo(w / 2 + Math.cos(ang) * 74, h / 2 + 10 + Math.sin(ang) * 74);
      ctx.stroke();
    }
  });

  var beltTex = makeCanvas(512, 64, function (ctx, w, h) {
    ctx.fillStyle = '#1c1d20';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#121316';
    for (var x = 0; x < w; x += 32) ctx.fillRect(x, 0, 14, h);
    ctx.strokeStyle = '#8a7044';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var c = 16; c < w; c += 64) {
      ctx.moveTo(c, h * 0.75);
      ctx.lineTo(c + 16, h * 0.25);
      ctx.lineTo(c + 32, h * 0.75);
    }
    ctx.stroke();
    ctx.fillStyle = '#5c4a28';
    ctx.fillRect(0, 0, w, 3);
    ctx.fillRect(0, h - 3, w, 3);
  });
  beltTex.wrapS = THREE.RepeatWrapping;
  beltTex.wrapT = THREE.ClampToEdgeWrapping;
  beltTex.repeat.set(8, 1);

  var hmiCanvas = document.createElement('canvas');
  hmiCanvas.width = 256;
  hmiCanvas.height = 160;
  var hmiCtx = hmiCanvas.getContext('2d');
  var hmiTex = new THREE.CanvasTexture(hmiCanvas);
  hmiTex.colorSpace = THREE.SRGBColorSpace;
  var hmiDrawn = '';

  function drawHmi(name, done) {
    var key = name + '/' + done;
    if (key === hmiDrawn) return;
    hmiDrawn = key;
    hmiCtx.fillStyle = '#100e0c';
    hmiCtx.fillRect(0, 0, 256, 160);
    hmiCtx.strokeStyle = '#d7bd86';
    hmiCtx.lineWidth = 4;
    hmiCtx.strokeRect(8, 8, 240, 144);
    hmiCtx.fillStyle = '#d7bd86';
    hmiCtx.font = '22px serif';
    hmiCtx.fillText('秦制工位', 24, 44);
    hmiCtx.font = '36px serif';
    hmiCtx.fillText(name, 24, 96);
    hmiCtx.font = '20px sans-serif';
    hmiCtx.fillStyle = '#b7ab96';
    hmiCtx.fillText('完成 ' + done + ' 件', 24, 132);
    hmiTex.needsUpdate = true;
  }

  var lacquer = new THREE.MeshPhysicalMaterial({
    color: 0x221c18,
    metalness: 0.62,
    roughness: 0.28,
    clearcoat: 0.9,
    clearcoatRoughness: 0.22,
    envMapIntensity: 0.7,
    emissive: 0x120e0c,
    emissiveIntensity: 0.18
  });
  var gold = new THREE.MeshPhysicalMaterial({
    color: 0xd4b36a,
    metalness: 1,
    roughness: 0.24,
    clearcoat: 0.35,
    clearcoatRoughness: 0.2,
    envMapIntensity: 1.15,
    emissive: 0x3a2810,
    emissiveIntensity: 0.12
  });
  var goldDeep = new THREE.MeshStandardMaterial({ color: 0x8c6a32, metalness: 1, roughness: 0.32 });
  var steel = new THREE.MeshStandardMaterial({ color: 0xb7bcc4, metalness: 1, roughness: 0.22 });
  var steelDark = new THREE.MeshStandardMaterial({ color: 0x6a7078, metalness: 1, roughness: 0.35 });
  var skin = new THREE.MeshStandardMaterial({ color: 0xb58968, roughness: 0.72, metalness: 0 });
  var hair = new THREE.MeshStandardMaterial({ color: 0x14120f, roughness: 0.7, metalness: 0.05 });
  var glove = new THREE.MeshStandardMaterial({ color: 0x1a1917, roughness: 0.55, metalness: 0.15 });
  var jade = new THREE.MeshStandardMaterial({ color: 0x1d6d5c, roughness: 0.35, metalness: 0.15, emissive: 0x0d3b30, emissiveIntensity: 0.4 });
  var cinnabar = new THREE.MeshStandardMaterial({ color: 0x8e2e2a, roughness: 0.45, metalness: 0.1 });
  var rubber = new THREE.MeshStandardMaterial({ map: beltTex, color: 0xffffff, roughness: 0.92, metalness: 0.04 });
  var floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.88, metalness: 0.08 });
  var wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.72, metalness: 0.18 });
  var robeMat = new THREE.MeshPhysicalMaterial({
    map: robeTex,
    color: 0x4a433c,
    metalness: 0.35,
    roughness: 0.48,
    clearcoat: 0.4,
    clearcoatRoughness: 0.28
  });
  var lampMat = new THREE.MeshStandardMaterial({

    shape.lineTo(x + w, y1);

    shape.lineTo(x0, y + h);
    shape.absarc(x0, y1, r, Math.PI / 2, Math.PI, false);

    shape.absarc(x0, y0, r, Math.PI, Math.PI * 1.5, false);

  var dustN = 42;

  var phaseIndex = 0;
  var phaseT = 0;
  var shiftCount = 0;
  var completed = 0;
  var simTime = 0;
  var paused = false;
  var speed = 1;
  var headYaw = 0;
  var headPitch = 0;
  var headReady = false;
  var selected = null;
  var running = true;

  function phaseId() {
    return PHASES[phaseIndex].id;
  }

  function stationPiece() {
    for (var i = 0; i < pieces.length; i++) {
      if (restS(pieces[i].step) === 3) return pieces[i];
    }
    return pieces[0];
  }

  function lookTargetPiece() {
    var want = phaseId() === 'shift' ? 1 : 3;
    for (var i = 0; i < pieces.length; i++) {
      if (restS(pieces[i].step) === want) return pieces[i];
    }
    return stationPiece();
  }

  function downstream(s) {
    return s === 3 || s === 5 || s === 7 || s === 9;
  }

  function resetPiece(p) {
    p.done = false;
    p.proud = PROUD_UP;
  }

  function resetSim() {
    phaseIndex = 0;
    phaseT = 0;
    shiftCount = 0;
    completed = 0;
    simTime = 0;
    headYaw = 0;
    headPitch = 0;
    headReady = false;
    for (var i = 0; i < pieces.length; i++) {
      pieces[i].step = i;
      var s = restS(i);
      pieces[i].done = downstream(s);
      pieces[i].proud = pieces[i].done ? PROUD_FLUSH : PROUD_UP;
    }
  }

  // Screw depth, blade angle and grip height are direct functions of the phase clock.
  //
  // 螺丝深度、刀头转角和握点高度都由当前相位直接算出，不逐帧累加。
  function visualProud(p) {
    if (phaseId() === 'twist' && p === stationPiece()) {
      return lerp(PROUD_UP, PROUD_FLUSH, smootherstep(phaseT));
    }
    return p.proud;
  }

  function visualGem(p) {
    if (phaseId() === 'confirm' && p === stationPiece()) return smootherstep(phaseT);
    return p.done ? 1 : 0;
  }

  function toolSpin() {
    if (phaseId() !== 'twist') return 0;
    var s = smootherstep(phaseT);
    if (s >= 1) return 0;
    return s * TURNS * Math.PI * 2;
  }

  function leanAngle() {
    var id = phaseId();
    var s = smootherstep(phaseT);
    if (id === 'shift') return lerp(0, 0.03, s);
    if (id === 'observe') return lerp(0.03, 0.045, s);
    if (id === 'align') return lerp(0.045, 0.16, s);
    if (id === 'press') return lerp(0.16, 0.2, s);
    if (id === 'twist') return 0.2;
    if (id === 'confirm') return lerp(0.2, 0.1, s);
    return lerp(0.1, 0, s);
  }

  function nodAngle() {
    if (phaseId() !== 'confirm') return 0;
    return Math.sin(smootherstep(phaseT) * Math.PI) * 0.1;
  }

  function beltDistance() {
    var s = shiftCount * SPACING;
    if (phaseId() === 'shift') s += smootherstep(phaseT) * SPACING;
    return s * X_SCALE;
  }

  function finishPhase(id) {
    if (id === 'shift') {
      for (var i = 0; i < pieces.length; i++) {
        pieces[i].step = (pieces[i].step + 1) % COUNT;
        if (restS(pieces[i].step) === 11) resetPiece(pieces[i]);
      }
      shiftCount += 1;
    } else if (id === 'twist') {
      var tw = stationPiece();
      tw.proud = PROUD_FLUSH;
    } else if (id === 'confirm') {
      var cf = stationPiece();
      cf.done = true;
      completed += 1;
    }
  }

  function step(dt) {
    if (!(dt > 0)) return;
    simTime += dt;
    var left = dt;
    var guard = 0;
    while (left > 1e-6 && guard++ < 8) {
      var dur = PHASES[phaseIndex].dur;
      var remain = (1 - phaseT) * dur;
      if (left < remain - 1e-8) {
        phaseT += left / dur;
        left = 0;
      } else {
        var id = PHASES[phaseIndex].id;
        left -= Math.max(remain, 0);
        phaseT = 1;
        finishPhase(id);
        phaseT = 0;
        phaseIndex = (phaseIndex + 1) % PHASES.length;
      }
    }
  }

  var tmpA = new THREE.Vector3();
  var tmpB = new THREE.Vector3();
  var tmpC = new THREE.Vector3();
  var restPos = new THREE.Vector3();
  var hoverPos = new THREE.Vector3();
  var contactPos = new THREE.Vector3();
  var liftedPos = new THREE.Vector3();
  var restQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.16, -0.12, -0.36));
  var scratchQ = new THREE.Quaternion();
  var rightPole = new THREE.Vector3(0.4, -0.9, 0.2);
  var leftPole = new THREE.Vector3(-0.4, -0.9, 0.2);

  function layoutPieces() {
    var spin = toolSpin();
    var active = stationPiece();
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      pathPoint(displayS(p.step), p.group.position);
      var proud = visualProud(p);
      p.screw.position.set(SCREW_X, PIECE_H + proud, SCREW_Z);
      p.screw.rotation.y = (phaseId() === 'twist' && p === active) ? spin : 0;
      p.gemMat.emissiveIntensity = 0.12 + visualGem(p) * 1.7;
      var onTop = p.group.position.y > 0.75;
      p.body.castShadow = onTop;
      p.group.visible = true;
    }
  }

  function placeDriver() {
    var id = phaseId();
    var s = smootherstep(phaseT);
    stationPiece().screwTop.getWorldPosition(contactPos);
    contactPos.y += TIP + GAP;
    hoverPos.set(contactPos.x, contactPos.y + HOVER, contactPos.z);
    liftedPos.set(contactPos.x, contactPos.y + LIFT, contactPos.z);
    restR.getWorldPosition(restPos);
    if (id === 'shift' || id === 'observe') {
      driver.position.copy(restPos);
      driver.quaternion.copy(restQ);
      return;
    }
    if (id === 'align') {
      driver.position.lerpVectors(restPos, hoverPos, s);
      driver.position.y += Math.sin(s * Math.PI) * 0.055;
      driver.quaternion.copy(restQ).slerp(IDQ, s);
      return;
    }
    if (id === 'press') {
      driver.position.lerpVectors(hoverPos, contactPos, s);
      driver.quaternion.identity();
      return;
    }
    if (id === 'twist') {
      driver.position.copy(contactPos);
      driver.quaternion.setFromAxisAngle(Y_AXIS, toolSpin());
      return;
    }
    if (id === 'confirm') {
      driver.position.lerpVectors(contactPos, liftedPos, s);
      driver.quaternion.identity();
      return;
    }
    driver.position.lerpVectors(liftedPos, restPos, s);
    driver.position.y += Math.sin(s * Math.PI) * 0.06;
    driver.quaternion.copy(IDQ).slerp(restQ, s);
  }

  function layoutEmperor(now) {
    var breathe = Math.sin(now * 0.0018) * 0.004;
    chest.rotation.x = leanAngle() + breathe;
    scene.updateMatrixWorld(true);
    var headPos = tmpA;
    headPivot.getWorldPosition(headPos);
    var focus = tmpB;
    lookTargetPiece().screwTop.getWorldPosition(focus);
    var delta = tmpC.copy(focus).sub(headPos);
    chest.updateWorldMatrix(true, false);
    scratchQ.setFromRotationMatrix(chest.matrixWorld).invert();
    delta.applyQuaternion(scratchQ);
    var yaw = Math.atan2(delta.x, delta.z);
    var pitch = Math.atan2(-delta.y, Math.hypot(delta.x, delta.z));
    yaw = clamp(yaw, -0.65, 0.65);
    pitch = clamp(pitch, -0.2, 0.55);
    if (!headReady) {
      headYaw = yaw;
      headPitch = pitch;
      headReady = true;
    } else {
      var k = 1 - Math.exp(-8 * 0.016);
      headYaw += (yaw - headYaw) * k;
      headPitch += (pitch - headPitch) * k;
    }
    headPivot.rotation.set(headPitch + nodAngle(), headYaw, 0);
  }

  function layoutBelt() {
    var d = beltDistance();
    beltTex.offset.x = -d / 5.7;
    var ang = d / 0.055;
    for (var i = 0; i < rollers.length; i++) rollers[i].rotation.y = ang;
    var hot = phaseId() === 'align' || phaseId() === 'press' || phaseId() === 'twist';
    for (var b = 0; b < brackets.length; b++) {
      brackets[b].material = hot ? gold : goldDeep;
    }
  }

  function layoutBeads(now) {
    for (var i = 0; i < beadPivot.length; i++) {
      beadPivot[i].rotation.x = Math.sin(now * 0.0022 + i * 0.7) * 0.055;
    }
  }

  function layoutDust(realDt) {
    for (var i = 0; i < dustN; i++) {
      var y = dustArr[i * 3 + 1] + realDt * 0.06;
      if (y > 1.85) {
        y = 0.45;
        dustArr[i * 3] = (Math.random() - 0.5) * 4.2;
        dustArr[i * 3 + 2] = -0.4 + Math.random() * 1.6;
      }
      dustArr[i * 3 + 1] = y;
    }
    dustGeo.attributes.position.needsUpdate = true;
  }

  function applyVisuals(now, realDt) {
    layoutPieces();
    scene.updateMatrixWorld(true);
    layoutEmperor(now);
    scene.updateMatrixWorld(true);
    placeDriver();
    solveTwoBone(right.upper, right.lower, driver.position, rightPole, UPPER, FORE);
    var leftTarget = tmpA;
    restL.getWorldPosition(leftTarget);
    if (phaseId() === 'confirm') leftTarget.y += Math.sin(smootherstep(phaseT) * Math.PI) * 0.08;
    solveTwoBone(left.upper, left.lower, leftTarget, leftPole, UPPER, FORE);
    layoutBelt();
    layoutBeads(now);
    layoutDust(realDt);
    if (selected) {
      selected.group.add(selectRing);
      selectRing.visible = true;
    } else {
      selectRing.visible = false;
    }
    scene.updateMatrixWorld(true);
  }

  function pieceBox(p, out) {
    var x = p.group.position.x;
    var y = p.group.position.y;
    var z = p.group.position.z;
    var top = y + PIECE_H + visualProud(p) + HEAD_H;
    out.min.set(x - PIECE_W / 2, y, z - PIECE_D / 2);
    out.max.set(x + PIECE_W / 2, top, z + PIECE_D / 2);
  }

  function overlap(a, b, pad) {
    return a.min.x < b.max.x + pad && a.max.x > b.min.x - pad &&
      a.min.y < b.max.y + pad && a.max.y > b.min.y - pad &&
      a.min.z < b.max.z + pad && a.max.z > b.min.z - pad;
  }

  function validate() {
    var issues = [];
    bodyGeo.computeBoundingBox();
    var pos = bodyGeo.attributes.position;
    var minR = Infinity;
    for (var vi = 0; vi < pos.count; vi++) {
      var r = Math.hypot(pos.getX(vi) - SCREW_X, pos.getZ(vi) - SCREW_Z);
      if (r < minR) minR = r;
    }
    if (!(minR > 0.016 && minR < 0.03)) issues.push('孔半径 ' + minR.toFixed(4));
    var maxWrist = 0;
    var maxTip = 0;
    var samples = 0;
    resetSim();
    var boxA = new THREE.Box3();
    var boxB = new THREE.Box3();
    var guard = 0;
    while (simTime < cycleDur * 2 - 0.02 && guard++ < 800) {
      applyVisuals(simTime * 1000, 1 / 30);
      var active = stationPiece();
      active.screwTop.getWorldPosition(tmpA);
      driverTip.getWorldPosition(tmpB);
      var id = phaseId();
      var contact = (id === 'press' && phaseT > 0.92) || id === 'twist' || (id === 'confirm' && phaseT < 0.08);
      if (contact) {
        var tipErr = tmpA.distanceTo(tmpB);
        if (tipErr > maxTip) maxTip = tipErr;
        if (Math.abs(tipErr - GAP) > 0.004) issues.push('刀头间隙 ' + tipErr.toFixed(4) + ' @ ' + id + ' ' + phaseT.toFixed(2));
        if (id === 'twist' && Math.abs(active.screw.rotation.y - toolSpin()) > 1e-4) issues.push('转角不同步');
      }
      right.wrist.getWorldPosition(tmpC);
      var werr = tmpC.distanceTo(driver.position);
      if (werr > maxWrist) maxWrist = werr;
      if (werr > 0.012) issues.push('右腕误差 ' + werr.toFixed(4) + ' @ ' + id);
      left.wrist.getWorldPosition(tmpC);
      restL.getWorldPosition(tmpB);
      if (id === 'confirm') tmpB.y += Math.sin(smootherstep(phaseT) * Math.PI) * 0.08;
      var lerr = tmpC.distanceTo(tmpB);
      if (lerr > 0.012) issues.push('左腕误差 ' + lerr.toFixed(4) + ' @ ' + id);
      for (var i = 0; i < pieces.length; i++) {
        pieceBox(pieces[i], boxA);
        for (var j = i + 1; j < pieces.length; j++) {
          pieceBox(pieces[j], boxB);
          if (overlap(boxA, boxB, -0.02)) issues.push('工件重叠 ' + pieces[i].id + ' ' + pieces[j].id);
        }
        if (!isFinite(pieces[i].group.position.x)) issues.push('工件坐标无效');
      }
      var proudNow = visualProud(active);
      if (proudNow < PROUD_FLUSH - 1e-4 || proudNow > PROUD_UP + 1e-4) issues.push('螺丝行程越界');
      var shankBottom = active.group.position.y + PIECE_H + proudNow - SHANK_L;
      if (shankBottom < active.group.position.y + 0.05) issues.push('螺丝穿出工件');
      samples++;
      if (issues.length > 12) break;
      step(1 / 30);
    }
    var endStation = stationPiece();
    if (completed < 2) issues.push('完成计数 ' + completed);
    if (!endStation.done) issues.push('工位工件未确认');
    var bb = bodyGeo.boundingBox;
    return {
      issues: issues,
      maxWrist: maxWrist,
      maxTip: maxTip,
      minR: minR,
      samples: samples,
      bb: bb.min.x.toFixed(2) + ',' + bb.min.y.toFixed(2) + ',' + bb.min.z.toFixed(2) + ' ' + bb.max.x.toFixed(2) + ',' + bb.max.y.toFixed(2) + ',' + bb.max.z.toFixed(2)
    };
  }

  function cycleProgress() {
    var acc = 0;
    for (var i = 0; i < phaseIndex; i++) acc += PHASES[i].dur;
    acc += PHASES[phaseIndex].dur * clamp(phaseT, 0, 1);
    return acc / cycleDur;
  }

  function placeName(p) {
    if (p.group.position.y < 0.6) return '回流';
    if (p.group.position.x < -0.75) return '进料';
    if (p.group.position.x > 0.75) return '出料';
    return '工位';
  }

  function screwName(p) {
    if (phaseId() === 'twist' && p === stationPiece()) return '旋拧中';
    if (p.done) return '已压紧';
    if (p.proud <= PROUD_FLUSH + 0.004) return '已拧入';
    return '待拧紧';
  }

  function updateHUD() {
    var name = PHASES[phaseIndex].name;
    phaseNameEl.textContent = name;

    for (var i = 0; i < chipEls.length; i++) {
      var on = chipEls[i].dataset.id === phaseId();
      if (on) chipEls[i].setAttribute('aria-current', 'true');
      else chipEls[i].removeAttribute('aria-current');
    }
    barFill.style.width = (cycleProgress() * 100).toFixed(2) + '%';
    countEl.textContent = '本班完成 ' + completed + ' 件';
    drawHmi(name, completed);
    if (name !== lastLive) {
      liveEl.textContent = '当前工序 ' + name;
      lastLive = name;
    }
    if (selected) {
      card.hidden = false;
      cardTitle.textContent = '工件 ' + (selected.id < 10 ? '0' : '') + selected.id;
      cardScrew.textContent = screwName(selected);
      cardPlace.textContent = placeName(selected);

  }

  function setHelp(open) {
    document.getElementById('help').hidden = !open;
    document.getElementById('helpBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('speedSlow').addEventListener('click', function () { setSpeed(0.5); });
  document.getElementById('speedNorm').addEventListener('click', function () { setSpeed(1); });
  document.getElementById('speedFast').addEventListener('click', function () { setSpeed(2); });
  document.getElementById('camBtn').addEventListener('click', resetCamera);
  document.getElementById('helpBtn').addEventListener('click', function () {
    setHelp(document.getElementById('help').hidden);
  });
  document.getElementById('helpClose').addEventListener('click', function () { setHelp(false); });

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dragging = false;
  var dragged = false;
  var pointers = new Map();
  var pinchDist = 0;
  var lastInput = 0;
  var raycaster = new THREE.Raycaster();
  var pointerNdc = new THREE.Vector2();

  function updateCamera() {
    var sp = Math.sin(phi);
    camera.position.set(
      look.x + radius * sp * Math.sin(theta),
      look.y + radius * Math.cos(phi),
      look.z + radius * sp * Math.cos(theta)
    );
    camera.lookAt(look);
  }

  function pick(clientX, clientY) {
    var rect = renderer.domElement.getBoundingClientRect();
    pointerNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNdc, camera);
    var hits = raycaster.intersectObjects(pieces.map(function (p) { return p.group; }), true);
    for (var i = 0; i < hits.length; i++) {
      var obj = hits[i].object;
      while (obj && !obj.userData.piece) obj = obj.parent;
      if (obj && obj.userData.piece) return obj.userData.piece;
    }
    return null;
  }

  renderer.domElement.addEventListener('pointerdown', function (e) {
    renderer.domElement.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    dragging = true;
    dragged = false;
    lastInput = performance.now();
    if (pointers.size === 2) {
      var pts = Array.from(pointers.values());
      pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }
  });
  renderer.domElement.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    var prev = pointers.get(e.pointerId);
    var dx = e.clientX - prev.x;
    var dy = e.clientY - prev.y;
    if (Math.hypot(dx, dy) > 3) dragged = true;
    if (pointers.size === 1) {
      theta -= dx * 0.005;
      phi = clamp(phi - dy * 0.004, 0.55, 1.48);
      velT = -dx * 0.005;
      velP = -dy * 0.004;
    } else if (pointers.size >= 2 && pinchDist > 0) {
      prev.x = e.clientX;
      prev.y = e.clientY;
      var pts2 = Array.from(pointers.values());
      var dist = Math.hypot(pts2[0].x - pts2[1].x, pts2[0].y - pts2[1].y);
      if (dist > 0) {
        radius = clamp(radius * (pinchDist / dist), 2.4, 8);
        pinchDist = dist;
      }
      return;
    }
    prev.x = e.clientX;
    prev.y = e.clientY;
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      dragging = false;
      if (!dragged) {
        selected = pick(e.clientX, e.clientY);
        if (!selected) card.hidden = true;
        updateHUD();
      }
    }
  }
  renderer.domElement.addEventListener('pointerup', endPointer);
  renderer.domElement.addEventListener('pointercancel', endPointer);
  renderer.domElement.addEventListener('wheel', function (e) {
    e.preventDefault();
    radius = clamp(radius * Math.exp(e.deltaY * 0.001), 2.4, 8);
    lastInput = performance.now();
  }, { passive: false });
  renderer.domElement.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  renderer.domElement.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    running = false;
    failEl.style.display = 'grid';
    failEl.textContent = '图形上下文已丢失。请刷新页面。';
  });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && (e.target === document.body || e.target === renderer.domElement)) {
      e.preventDefault();
      togglePause();
    } else if (e.code === 'KeyR') {
      resetCamera();
    } else if (e.code === 'Digit1') {
      setSpeed(0.5);
    } else if (e.code === 'Digit2') {
      setSpeed(1);
    } else if (e.code === 'Digit3') {
      setSpeed(2);
    } else if (e.code === 'Escape') {
      setHelp(false);
      selected = null;
      card.hidden = true;
    }
  });

  function resize() {
    var stage = document.getElementById('stage');
    var w = stage.clientWidth;
    var h = stage.clientHeight;
    if (w < 2 || h < 2) {
      w = window.innerWidth || 1440;
      h = Math.max(2, (window.innerHeight || 900) - 56);
    }
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';
  }
  window.addEventListener('resize', resize);
  resize();

  if (params.get('hud') === '0') {
    document.getElementById('process').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    document.getElementById('vignette').style.display = 'none';
    document.querySelector('header').style.display = 'none';
  }

  var report;
  try {
    report = validate();
  } catch (err) {
    report = { issues: [String(err && err.stack || err)], maxWrist: -1, maxTip: -1, minR: -1, samples: 0 };
  }
  resetSim();
  var seek = Number(params.get('t'));
  if (isFinite(seek) && seek > 0) {
    var sg = 0;
    while (simTime < seek && sg++ < 20000) step(1 / 60);
    if (params.get('play') !== '1') paused = true;
  }
  applyVisuals(performance.now(), 0.016);
  updateHUD();
  updateCamera();
  renderer.render(scene, camera);

  var issueText = report.issues.slice(0, 8).join(' | ');
  diagEl.textContent = (report.issues.length ? 'ISSUES ' + issueText : 'OK') +
    ' wrist=' + report.maxWrist.toFixed(4) +
    ' tip=' + report.maxTip.toFixed(4) +
    ' hole=' + report.minR.toFixed(4) +
    ' bb=' + (report.bb || '') +
    ' samples=' + report.samples +
    ' canvas=' + renderer.domElement.width + 'x' + renderer.domElement.height +
    ' view=' + renderer.domElement.clientWidth + 'x' + renderer.domElement.clientHeight +
    ' cam=' + camera.position.x.toFixed(2) + ',' + camera.position.y.toFixed(2) + ',' + camera.position.z.toFixed(2);
  if (params.get('once') === '1') {
    var gl = renderer.getContext();
    var pix = new Uint8Array(4);
    var cw = renderer.domElement.width;
    var ch = renderer.domElement.height;
    var grid = [];
    for (var gy = 1; gy <= 4; gy++) {
      for (var gx = 1; gx <= 6; gx++) {
        gl.readPixels((cw * gx / 7) | 0, (ch * gy / 5) | 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pix);
        grid.push(pix[0] + '.' + pix[1] + '.' + pix[2]);
      }
    }
    diagEl.textContent += ' grid=' + grid.join(',');
  }
  if (params.get('shot') === '1') {
    var shotUrl = renderer.domElement.toDataURL('image/jpeg', 0.86);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/shot', false);
    xhr.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
    xhr.send(shotUrl);
  }
  if (report.issues.length) {
    failEl.style.display = 'grid';
    failEl.textContent = '场景自检未通过';
  }
  bootEl.style.display = 'none';

  var last = performance.now();
  function frame(now) {
    if (!running) return;
    var realDt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (document.hidden) {
      requestAnimationFrame(frame);
      return;
    }
    if (!paused) step(realDt * speed);
    if (!dragging) {
      theta += velT;
      phi = clamp(phi + velP, 0.55, 1.48);
      velT *= 0.9;
      velP *= 0.9;
      if (!reduceMotion && Math.abs(velT) < 1e-4 && now - lastInput > 4500) {
        theta += Math.sin(now * 0.0002) * 0.00012;
      }
    }
    applyVisuals(now, realDt);
    updateHUD();
    updateCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  if (params.get('once') === '1') running = false;
  else requestAnimationFrame(frame);

  window.__qin = {
    step: step,
    resetSim: resetSim,
    applyVisuals: applyVisuals,
    report: function () { return diagEl.textContent; }
  };
})();
</script>
</body>
</html>
