<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试索引</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f3ec;
    --card: #fffdf8;
    --ink: #1c1915;
    --muted: #5e584e;
    --line: #ddd4c4;
    --gold: #8a6232;
    --gold-soft: #f3e6cf;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", sans-serif;
    line-height: 1.5;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 24px;
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  h1 {
    margin: 0;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  h1 small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: 13px;
    letter-spacing: 0;
    font-weight: 400;
  }
  nav { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  nav a { color: var(--gold); text-decoration: none; }
  nav a:hover, nav a:focus-visible { text-decoration: underline; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 24px 48px; }
  .summary { margin: 0 0 16px; color: var(--muted); }
  .tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  label { color: var(--muted); font-size: 14px; }
  input[type="search"] {
    min-width: min(100%, 280px);
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
  }
  button {
    font: inherit;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover, button:focus-visible, th button:hover, th button:focus-visible {
    border-color: var(--gold);
    outline: none;
  }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th button {
    padding: 0;
    border: 0;
    background: transparent;
    font-weight: 650;
    cursor: pointer;
  }
  tr:last-child td { border-bottom: 0; }
  td a { color: var(--gold); }
  .empty { margin: 12px 0 0; color: var(--muted); }
  section { margin-top: 28px; }
  h2, h3 {
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    letter-spacing: 0.04em;
  }
  h2 { margin: 0 0 8px; font-size: 22px; }
  h3 { margin: 16px 0 8px; font-size: 16px; color: var(--muted); }
  h4 { margin: 12px 0 6px; font-size: 14px; font-weight: 600; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 6px 0; }
  .path { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>测试索引<small id="lead">按模型、版本、日期列出全部测试</small></h1>
  <nav id="nav" aria-label="页面"></nav>
</header>
<main>
  <p class="summary" id="summary"></p>
  <section id="all">
    <h2>全部测试</h2>
    <div class="tools">
      <label for="q">过滤</label>
      <input id="q" type="search" placeholder="模型、版本、日期或测试名称" autocomplete="off">
      <button type="button" id="clear">清除</button>
      <span id="filterState" class="path"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><button type="button" data-key="model">模型</button></th>
            <th><button type="button" data-key="version">版本</button></th>
            <th><button type="button" data-key="date">日期</button></th>
            <th><button type="button" data-key="name">测试</button></th>
            <th>打开</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden>没有匹配的测试。</p>
  </section>
  <div id="groups"></div>
</main>
<script>
(function () {
  "use strict";
  var tests = [
    {
      model: "Grok",
      version: "4.7",
      date: "20260922",
      name: "秦始皇在现代流水线上打螺丝",
      href: "grok/4.7/20260922/qin-shihuang-assembly.1790011920.html",
      record: "grok/4.7/20260922/qin-shihuang-assembly.1790011920.md"
    }
  ];

  var sortKey = "model";
  var sortDir = 1;
  var q = document.getElementById("q");
  var rows = document.getElementById("rows");
  var empty = document.getElementById("empty");
  var filterState = document.getElementById("filterState");
  var summary = document.getElementById("summary");
  var nav = document.getElementById("nav");
  var groups = document.getElementById("groups");

  function versionRank(value) {
    return String(value).split(/[.+_-]/).map(function (part) {
      var n = Number(part);
      return part !== "" && !isNaN(n) ? n : part.toLowerCase();
    });
  }

  function compareVersion(a, b) {
    var aa = versionRank(a);
    var bb = versionRank(b);
    var n = Math.max(aa.length, bb.length);
    for (var i = 0; i < n; i++) {
      var av = aa[i];
      var bv = bb[i];
      if (av === undefined) return -1;
      if (bv === undefined) return 1;
      if (typeof av === "number" && typeof bv === "number") {
        if (av !== bv) return av - bv;
      } else {
        var c = String(av).localeCompare(String(bv), "zh");
        if (c !== 0) return c;
      }
    }
    return 0;
  }

  function compare(a, b) {
    var result = 0;
    if (sortKey === "version") result = compareVersion(a.version, b.version);
    else if (sortKey === "date") result = Number(a.date) - Number(b.date);
    else result = String(a[sortKey]).localeCompare(String(b[sortKey]), "zh");
    if (result === 0) result = a.model.localeCompare(b.model, "zh") || compareVersion(a.version, b.version) || (Number(a.date) - Number(b.date)) || a.name.localeCompare(b.name, "zh");
    return result * sortDir;
  }

  function filtered() {
    var text = q.value.trim().toLowerCase();
    return tests.filter(function (item) {
      if (!text) return true;
      return (item.model + " " + item.version + " " + item.date + " " + item.name + " " + item.href).toLowerCase().indexOf(text) !== -1;
    }).sort(compare);
  }

  function slug(value) {
    return encodeURIComponent(value).replace(/%/g, "");
  }

  function render() {
    var list = filtered();
    var text = q.value.trim();
    rows.innerHTML = "";
    list.forEach(function (item) {
      var tr = document.createElement("tr");
      [item.model, item.version, item.date, item.name].forEach(function (value) {
        var td = document.createElement("td");
        td.textContent = value;
        tr.appendChild(td);
      });
      var linkTd = document.createElement("td");
      var link = document.createElement("a");
      link.href = item.href;
      link.textContent = "进入";
      linkTd.appendChild(link);
      if (item.record) {
        linkTd.appendChild(document.createTextNode(" "));
        var record = document.createElement("a");
        record.href = item.record;
        record.textContent = "记录";
        linkTd.appendChild(record);
      }
      var path = document.createElement("div");
      path.className = "path";
      path.textContent = item.href;
      linkTd.appendChild(path);
      tr.appendChild(linkTd);
      rows.appendChild(tr);
    });
    empty.hidden = list.length !== 0;
    filterState.textContent = text ? "当前过滤：" + text : "当前显示全部";
    document.querySelectorAll("th button").forEach(function (button) {
      var key = button.getAttribute("data-key");
      var label = { model: "模型", version: "版本", date: "日期", name: "测试" }[key];
      var mark = key === sortKey ? (sortDir > 0 ? " ↑" : " ↓") : "";
      button.textContent = label + mark;
      button.parentElement.setAttribute("aria-sort", key === sortKey ? (sortDir > 0 ? "ascending" : "descending") : "none");
    });
  }

  function renderCatalog() {
    var models = [];
    tests.forEach(function (item) {
      var model = models.find(function (entry) { return entry.model === item.model; });
      if (!model) {
        model = { model: item.model, versions: [] };
        models.push(model);
      }
      var version = model.versions.find(function (entry) { return entry.version === item.version; });
      if (!version) {
        version = { version: item.version, dates: [] };
        model.versions.push(version);
      }
      var day = version.dates.find(function (entry) { return entry.date === item.date; });
      if (!day) {
        day = { date: item.date, items: [] };
        version.dates.push(day);
      }
      day.items.push(item);
    });
    models.sort(function (a, b) { return a.model.localeCompare(b.model, "zh"); });
    models.forEach(function (model) {
      model.versions.sort(function (a, b) { return compareVersion(a.version, b.version); });
      model.versions.forEach(function (version) {
        version.dates.sort(function (a, b) { return Number(a.date) - Number(b.date); });
        version.dates.forEach(function (day) {
          day.items.sort(function (a, b) { return a.name.localeCompare(b.name, "zh"); });
        });
      });
    });

    var modelCount = models.length;
    var versionCount = models.reduce(function (sum, model) { return sum + model.versions.length; }, 0);
    summary.textContent = "共 " + modelCount + " 个模型，" + versionCount + " 个版本，" + tests.length + " 个测试。";

    nav.innerHTML = "";
    var all = document.createElement("a");
    all.href = "#all";
    all.textContent = "全部测试";
    nav.appendChild(all);
    models.forEach(function (model) {
      var link = document.createElement("a");
      link.href = "#model-" + slug(model.model);
      link.textContent = model.model;
      nav.appendChild(link);
    });

    groups.innerHTML = "";
    models.forEach(function (model) {
      var section = document.createElement("section");
      section.id = "model-" + slug(model.model);
      var title = document.createElement("h2");
      title.textContent = model.model;
      section.appendChild(title);
      model.versions.forEach(function (version) {
        var block = document.createElement("section");
        block.id = section.id + "-" + slug(version.version);
        var heading = document.createElement("h3");
        heading.textContent = version.version;
        block.appendChild(heading);
        version.dates.forEach(function (day) {
          var dayTitle = document.createElement("h4");
          dayTitle.textContent = day.date;
          var list = document.createElement("ul");
          day.items.forEach(function (item) {
            var li = document.createElement("li");
            var link = document.createElement("a");
            link.href = item.href;
            link.textContent = item.name;
            li.appendChild(link);
            list.appendChild(li);
          });
          block.appendChild(dayTitle);
          block.appendChild(list);
        });
        section.appendChild(block);
      });
      groups.appendChild(section);
    });
  }

  document.querySelectorAll("th button").forEach(function (button) {
    button.addEventListener("click", function () {
      var key = button.getAttribute("data-key");
      if (sortKey === key) sortDir = -sortDir;
      else {
        sortKey = key;
        sortDir = 1;
      }
      render();
    });
  });
  q.addEventListener("input", render);
  document.getElementById("clear").addEventListener("click", function () {
    q.value = "";
    render();
    q.focus();
  });

  renderCatalog();
  render();
})();
</script>
</body>
</html>
