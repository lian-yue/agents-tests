<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test index</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f3ec;
    --card: #fffdf8;
    --ink: #1c1915;
    --muted: #5e584e;
    --line: #ddd4c4;
    --gold: #8a6232;
    --gold-soft: #f3e6cf;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", sans-serif;
    line-height: 1.5;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 24px;
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  h1 {
    margin: 0;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  h1 small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: 13px;
    letter-spacing: 0;
    font-weight: 400;
  }
  nav, #nav { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  nav a, h1 a { color: var(--gold); text-decoration: none; }
  nav a:hover, nav a:focus-visible, h1 a:hover, h1 a:focus-visible { text-decoration: underline; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 24px 48px; }
  .summary { margin: 0 0 16px; color: var(--muted); }
  .tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  label { color: var(--muted); font-size: 14px; }
  input[type="search"] {
    flex: 1 1 auto;
    width: auto;
    min-width: min(100%, 20rem);
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
  }
  button {
    font: inherit;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover, button:focus-visible, th button:hover, th button:focus-visible {
    border-color: var(--gold);
    outline: none;
  }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th button {
    padding: 0;
    border: 0;
    background: transparent;
    font-weight: 650;
    cursor: pointer;
  }
  td button.facet {
    padding: 2px 8px;
    border-radius: 999px;
    background: transparent;
  }
  td button.facet[aria-pressed="true"] {
    background: var(--gold-soft);
    border-color: var(--gold);
  }
  tr:last-child td { border-bottom: 0; }
  td a { color: var(--gold); }
  .empty { margin: 12px 0 0; color: var(--muted); }
  section { margin-top: 28px; }
  h2, h3 {
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    letter-spacing: 0.04em;
  }
  h2 { margin: 0 0 8px; font-size: 22px; }
  h3 { margin: 16px 0 8px; font-size: 16px; color: var(--muted); }
  h4 { margin: 12px 0 6px; font-size: 14px; font-weight: 600; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 6px 0; }
  .path { color: var(--muted); font-size: 12px; }
  #filterState { margin: 0 0 12px; }
</style>
</head>
<body>
<header>
  <h1><a href="https://github.com/lian-yue/agents-tests">agents-tests</a><small id="lead">Every model, version, date, and test</small></h1>
  <nav aria-label="Page">
    <a href="https://github.com/lian-yue/agents-tests">Repository</a>
    <span id="nav"></span>
  </nav>
</header>
<main>
  <p class="summary" id="summary"></p>
  <p class="path">Path: model/version/depth/speed/source/driver/YYYYMMDD/language/name.unix.html</p>
  <section id="all">
    <h2>All tests</h2>
    <div class="tools">
      <label for="q">Filter</label>
      <input id="q" type="search" placeholder="Model, version, depth, speed, source, driver, date, language, or test" autocomplete="off">
      <button type="button" id="clear">Clear</button>
    </div>
    <p id="filterState" class="path"></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><button type="button" data-key="model">Model</button></th>
            <th><button type="button" data-key="version">Version</button></th>
            <th><button type="button" data-key="depth">Depth</button></th>
            <th><button type="button" data-key="speed">Speed</button></th>
            <th><button type="button" data-key="source">Source</button></th>
            <th><button type="button" data-key="driver">Driver</button></th>
            <th><button type="button" data-key="date">Date</button></th>
            <th><button type="button" data-key="language">Language</button></th>
            <th><button type="button" data-key="name">Test</button></th>
            <th>Open</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden>No matching tests.</p>
  </section>
  <div id="groups"></div>
</main>
<script>
(function () {
  "use strict";
  var tests = [
    {
      model: "Grok",
      version: "4.7",
      depth: "xhigh",
      speed: "fast",
      source: "subscription",
      driver: "grokbuild",
      date: "20260922",
      language: "zh",
      name: "秦始皇在现代流水线上打螺丝",
      href: "grok/4.7/xhigh/fast/subscription/grokbuild/20260922/zh/qin-shihuang-assembly.1790011920.html",
      record: "https://github.com/lian-yue/agents-tests/blob/main/grok/4.7/xhigh/fast/subscription/grokbuild/20260922/zh/qin-shihuang-assembly.1790011920.md"
    },
    {
      model: "Grok",
      version: "4.7",
      depth: "xhigh",
      speed: "fast",
      source: "subscription",
      driver: "grokbuild",
      date: "20260922",
      language: "zh",
      name: "鹈鹕骑自行车",
      href: "grok/4.7/xhigh/fast/subscription/grokbuild/20260922/zh/pelican-bicycle.1790014503.html",
      record: "https://github.com/lian-yue/agents-tests/blob/main/grok/4.7/xhigh/fast/subscription/grokbuild/20260922/zh/pelican-bicycle.1790014503.md"
    }
  ];

  var sortKey = "model";
  var sortDir = 1;
  var facetKeys = ["model", "version", "depth", "speed", "source", "driver", "date", "language"];
  var facets = { model: [], version: [], depth: [], speed: [], source: [], driver: [], date: [], language: [] };
  var q = document.getElementById("q");
  var rows = document.getElementById("rows");
  var empty = document.getElementById("empty");
  var filterState = document.getElementById("filterState");
  var summary = document.getElementById("summary");
  var nav = document.getElementById("nav");
  var groups = document.getElementById("groups");

  function versionRank(value) {
    return String(value).split(/[.+_-]/).map(function (part) {
      var n = Number(part);
      return part !== "" && !isNaN(n) ? n : part.toLowerCase();
    });
  }

  function compareVersion(a, b) {
    var aa = versionRank(a);
    var bb = versionRank(b);
    var n = Math.max(aa.length, bb.length);
    for (var i = 0; i < n; i++) {
      var av = aa[i];
      var bv = bb[i];
      if (av === undefined) return -1;
      if (bv === undefined) return 1;
      if (typeof av === "number" && typeof bv === "number") {
        if (av !== bv) return av - bv;
      } else {
        var c = String(av).localeCompare(String(bv), "zh");
        if (c !== 0) return c;
      }
    }
    return 0;
  }

  function compare(a, b) {
    var result = 0;
    if (sortKey === "version") result = compareVersion(a.version, b.version);
    else if (sortKey === "date") result = Number(a.date) - Number(b.date);
    else result = String(a[sortKey]).localeCompare(String(b[sortKey]), "zh");
    if (result === 0) result = a.model.localeCompare(b.model, "en") || compareVersion(a.version, b.version) || a.depth.localeCompare(b.depth, "en") || a.speed.localeCompare(b.speed, "en") || a.source.localeCompare(b.source, "en") || a.driver.localeCompare(b.driver, "en") || (Number(a.date) - Number(b.date)) || a.language.localeCompare(b.language, "en") || a.name.localeCompare(b.name, "zh");
    return result * sortDir;
  }

  function facetOn(key, value) {
    return facets[key].indexOf(value) !== -1;
  }

  function toggleFacet(key, value) {
    var list = facets[key];
    var index = list.indexOf(value);
    if (index === -1) list.push(value);
    else list.splice(index, 1);
    render();
  }

  function matchesFacets(item) {
    for (var i = 0; i < facetKeys.length; i++) {
      var key = facetKeys[i];
      if (facets[key].length && facets[key].indexOf(item[key]) === -1) return false;
    }
    return true;
  }

  function filtered() {
    var text = q.value.trim().toLowerCase();
    return tests.filter(function (item) {
      if (!matchesFacets(item)) return false;
      if (!text) return true;
      return (item.model + " " + item.version + " " + item.depth + " " + item.speed + " " + item.source + " " + item.driver + " " + item.date + " " + item.language + " " + item.name + " " + item.href).toLowerCase().indexOf(text) !== -1;
    }).sort(compare);
  }

  function slug(value) {
    return encodeURIComponent(value).replace(/%/g, "");
  }

  function render() {
    var list = filtered();
    var text = q.value.trim();
    rows.innerHTML = "";
    list.forEach(function (item) {
      var tr = document.createElement("tr");
      ["model", "version", "depth", "speed", "source", "driver", "date", "language", "name"].forEach(function (key) {
        var td = document.createElement("td");
        if (facets[key]) {
          var facet = document.createElement("button");
          facet.type = "button";
          facet.className = "facet";
          facet.textContent = item[key];
          facet.setAttribute("aria-pressed", facetOn(key, item[key]) ? "true" : "false");
          facet.addEventListener("click", function () { toggleFacet(key, item[key]); });
          td.appendChild(facet);
        } else {
          td.textContent = item[key];
        }
        tr.appendChild(td);
      });
      var linkTd = document.createElement("td");
      var link = document.createElement("a");
      link.href = item.href;
      link.textContent = "Open";
      linkTd.appendChild(link);
      if (item.record) {
        linkTd.appendChild(document.createTextNode(" "));
        var record = document.createElement("a");
        record.href = /^https?:\/\//.test(item.record)
          ? item.record
          : "https://github.com/lian-yue/agents-tests/blob/main/" + item.record.replace(/^\//, "");
        record.textContent = "Record";
        linkTd.appendChild(record);
      }
      var path = document.createElement("div");
      path.className = "path";
      path.textContent = item.href;
      linkTd.appendChild(path);
      tr.appendChild(linkTd);
      rows.appendChild(tr);
    });
    empty.hidden = list.length !== 0;
    var chosen = [];
    facetKeys.forEach(function (key) {
      var label = { model: "Model", version: "Version", depth: "Depth", speed: "Speed", source: "Source", driver: "Driver", date: "Date", language: "Language" }[key];
      facets[key].forEach(function (value) { chosen.push(label + " = " + value); });
    });
    if (text) chosen.push("Text = " + text);
    filterState.textContent = chosen.length ? chosen.join(", ") : "Showing all";
    document.querySelectorAll("th button").forEach(function (button) {
      var key = button.getAttribute("data-key");
      var label = { model: "Model", version: "Version", depth: "Depth", speed: "Speed", source: "Source", driver: "Driver", date: "Date", language: "Language", name: "Test" }[key];
      var mark = key === sortKey ? (sortDir > 0 ? " ↑" : " ↓") : "";
      button.textContent = label + mark;
      button.parentElement.setAttribute("aria-sort", key === sortKey ? (sortDir > 0 ? "ascending" : "descending") : "none");
    });
  }

  function renderCatalog() {
    var models = [];
    tests.forEach(function (item) {
      var model = models.find(function (entry) { return entry.model === item.model; });
      if (!model) {
        model = { model: item.model, versions: [] };
        models.push(model);
      }
      var version = model.versions.find(function (entry) { return entry.version === item.version; });
      if (!version) {
        version = { version: item.version, depths: [] };
        model.versions.push(version);
      }
      var depth = version.depths.find(function (entry) { return entry.depth === item.depth; });
      if (!depth) {
        depth = { depth: item.depth, speeds: [] };
        version.depths.push(depth);
      }
      var speed = depth.speeds.find(function (entry) { return entry.speed === item.speed; });
      if (!speed) {
        speed = { speed: item.speed, sources: [] };
        depth.speeds.push(speed);
      }
      var source = speed.sources.find(function (entry) { return entry.source === item.source; });
      if (!source) {
        source = { source: item.source, drivers: [] };
        speed.sources.push(source);
      }
      var driver = source.drivers.find(function (entry) { return entry.driver === item.driver; });
      if (!driver) {
        driver = { driver: item.driver, dates: [] };
        source.drivers.push(driver);
      }
      var day = driver.dates.find(function (entry) { return entry.date === item.date; });
      if (!day) {
        day = { date: item.date, languages: [] };
        driver.dates.push(day);
      }
      var language = day.languages.find(function (entry) { return entry.language === item.language; });
      if (!language) {
        language = { language: item.language, items: [] };
        day.languages.push(language);
      }
      language.items.push(item);
    });
    models.sort(function (a, b) { return a.model.localeCompare(b.model, "zh"); });
    models.forEach(function (model) {
      model.versions.sort(function (a, b) { return compareVersion(a.version, b.version); });
      model.versions.forEach(function (version) {
        version.depths.sort(function (a, b) { return a.depth.localeCompare(b.depth, "en"); });
        version.depths.forEach(function (depth) {
          depth.speeds.sort(function (a, b) { return a.speed.localeCompare(b.speed, "en"); });
          depth.speeds.forEach(function (speed) {
            speed.sources.sort(function (a, b) { return a.source.localeCompare(b.source, "en"); });
            speed.sources.forEach(function (source) {
              source.drivers.sort(function (a, b) { return a.driver.localeCompare(b.driver, "en"); });
              source.drivers.forEach(function (driver) {
                driver.dates.sort(function (a, b) { return Number(a.date) - Number(b.date); });
                driver.dates.forEach(function (day) {
                  day.languages.sort(function (a, b) { return a.language.localeCompare(b.language, "en"); });
                  day.languages.forEach(function (language) {
                    language.items.sort(function (a, b) { return a.name.localeCompare(b.name, "zh"); });
                  });
                });
              });
            });
          });
        });
      });
    });

    var modelCount = models.length;
    var versionCount = models.reduce(function (sum, model) { return sum + model.versions.length; }, 0);
    summary.textContent = modelCount + " model" + (modelCount === 1 ? "" : "s") + ", " + versionCount + " version" + (versionCount === 1 ? "" : "s") + ", " + tests.length + " test" + (tests.length === 1 ? "" : "s") + ".";

    nav.replaceChildren();
    var all = document.createElement("a");
    all.href = "#all";
    all.textContent = "All tests";
    nav.appendChild(all);

    groups.innerHTML = "";
    models.forEach(function (model) {
      var section = document.createElement("section");
      section.id = "model-" + slug(model.model);
      var title = document.createElement("h2");
      title.textContent = model.model;
      section.appendChild(title);
      model.versions.forEach(function (version) {
        var block = document.createElement("section");
        block.id = section.id + "-" + slug(version.version);
        var heading = document.createElement("h3");
        heading.textContent = version.version;
        block.appendChild(heading);
        version.depths.forEach(function (depth) {
          var depthTitle = document.createElement("h4");
          depthTitle.textContent = depth.depth;
          block.appendChild(depthTitle);
          depth.speeds.forEach(function (speed) {
            speed.sources.forEach(function (source) {
              source.drivers.forEach(function (driver) {
                driver.dates.forEach(function (day) {
                  day.languages.forEach(function (language) {
                    var meta = document.createElement("p");
                    meta.className = "path";
                    meta.textContent = speed.speed + " / " + source.source + " / " + driver.driver + " / " + day.date + " / " + language.language;
                    var list = document.createElement("ul");
                    language.items.forEach(function (item) {
                      var li = document.createElement("li");
                      var link = document.createElement("a");
                      link.href = item.href;
                      link.textContent = item.name;
                      li.appendChild(link);
                      list.appendChild(li);
                    });
                    block.appendChild(meta);
                    block.appendChild(list);
                  });
                });
              });
            });
          });
        });
        section.appendChild(block);
      });
      groups.appendChild(section);
    });
  }

  document.querySelectorAll("th button").forEach(function (button) {
    button.addEventListener("click", function () {
      var key = button.getAttribute("data-key");
      if (sortKey === key) sortDir = -sortDir;
      else {
        sortKey = key;
        sortDir = 1;
      }
      render();
    });
  });
  q.addEventListener("input", render);
  document.getElementById("clear").addEventListener("click", function () {
    q.value = "";
    facetKeys.forEach(function (key) { facets[key] = []; });
    render();
    q.focus();
  });

  renderCatalog();
  render();
})();
</script>
</body>
</html>
